<meta charset="utf-8">
<title>ENFILADE 디자인 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: one reading column under a sticky tally. Each item is a slanted memo tag, the complaint it answers, then its
   drafts side by side as small game screens that all run on one clock. One dark look, the HUD's own: near-black,
   near-white and the one pink. */
:root {
  --bg: #0e0e11;
  --panel: #16161b;
  --sunk: #0a0a0c;
  --line: #2a2a31;
  --fg: #f7f7f7;
  --muted: #9b99a4;
  --accent: #ff4f78;      /* KitStyle.Accent, the HUD's one pink */
  --on-accent: #0e0e11;
  --ice: #fff5f7;
  --ok: #7be0a8;
  --warn: #ffb547;
  --display: "Black Han Sans", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.gutter { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { padding-block: 28px 16px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; color: var(--accent); }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(30px, 6vw, 46px); line-height: 1.1; margin: 6px 0 10px; text-wrap: balance; }
.lede { margin: 0; max-width: 64ch; color: var(--muted); }
.lede strong { color: var(--fg); font-weight: 500; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar .gutter { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 10px; }
.tally { font-size: 14px; font-variant-numeric: tabular-nums; }
.tally b { color: var(--accent); font-weight: 600; }
.status { font-size: 12.5px; color: var(--muted); flex: 1 1 180px; min-width: 0; }
.status.warn { color: var(--warn); }
.btn { font: 500 13px/1 var(--body); color: var(--fg); background: var(--panel); border: 1px solid var(--line); padding: 9px 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main { padding-block: 22px 64px; display: flex; flex-direction: column; gap: 44px; }
.item-head { display: grid; gap: 8px; padding-bottom: 12px; border-bottom: 2px solid var(--fg); margin-bottom: 14px; }
.item-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.memo { display: inline-block; background: var(--accent); color: var(--on-accent); font-family: var(--mono); font-size: 12px; font-weight: 500; padding: 4px 10px; transform: skewX(-12deg); white-space: nowrap; }
.memo span { display: inline-block; transform: skewX(12deg); }
.item h2 { font-family: var(--display); font-weight: 400; font-size: clamp(22px, 4.4vw, 28px); line-height: 1.15; margin: 0; }
.picked { margin-left: auto; font-family: var(--mono); font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.picked.on { color: var(--ok); }
.quote { margin: 0; padding-left: 12px; border-left: 3px solid var(--line); color: var(--fg); max-width: 70ch; }
.now { margin: 0; color: var(--muted); font-size: 14px; max-width: 70ch; }

.drafts { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; }
.card[data-on="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.stage { background: var(--sunk); line-height: 0; }
.stage canvas { display: block; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; }
.card-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.card-name { display: flex; align-items: baseline; gap: 10px; }
.letter { font-family: var(--display); font-size: 26px; line-height: 1; color: var(--accent); }
.card h3 { margin: 0; font-size: 16px; font-weight: 600; }
.pitch { margin: 0; color: var(--muted); font-size: 14px; flex: 1; }
.card-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.pick { font: 600 13.5px/1 var(--body); padding: 10px 14px; background: transparent; color: var(--fg); border: 1px solid var(--fg); cursor: pointer; flex: 1 1 auto; }
.pick:hover { border-color: var(--accent); color: var(--accent); }
.pick[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.snd { font: 500 12.5px/1 var(--body); padding: 10px 10px; background: var(--sunk); color: var(--fg); border: 1px solid var(--line); cursor: pointer; }
.snd:hover { border-color: var(--accent); }
.pick:disabled, .snd:disabled { opacity: .5; cursor: not-allowed; }

.after { display: grid; gap: 8px; margin-top: 12px; }
.after-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.none { font: 500 13px/1 var(--body); padding: 9px 12px; background: transparent; color: var(--muted); border: 1px dashed var(--line); cursor: pointer; }
.none[aria-pressed="true"] { color: var(--bg); background: var(--warn); border: 1px solid var(--warn); }
.extra { margin: 0; font-size: 13.5px; color: var(--muted); }
.after label { font-size: 13px; color: var(--muted); }
.after textarea { font: 14px/1.5 var(--body); color: var(--fg); background: var(--sunk); border: 1px solid var(--line); padding: 9px 11px; resize: vertical; min-height: 60px; width: 100%; }

footer.foot { padding-block: 0 44px; color: var(--muted); font-size: 13.5px; }
@media (max-width: 560px) { .picked { margin-left: 0; } }
</style>

<header class="top">
  <div class="gutter">
    <div class="eyebrow">0.8.2 이후 · D단계</div>
    <h1>ENFILADE 디자인 시안</h1>
    <p class="lede">만들기 전에 방향부터 고르는 페이지예요. 항목마다 시안이 셋씩 움직이고 있어요. <strong>마음에 드는 것을 고르고</strong>, 섞고 싶거나 바꾸고 싶은 점은 아래 칸에 적어 주세요. 그림은 느낌을 보려는 것이라 게임 화면과 똑같지는 않아요. 다 고른 뒤 Claude에게 "시안 고른 거 봐 줘"라고 하면 그대로 만들어요.</p>
  </div>
</header>

<div class="bar">
  <div class="gutter">
    <span class="tally">고른 것 <b id="n-done">0</b> / <span id="n-all">0</span></span>
    <span class="status" id="status">저장소에 연결 중…</span>
    <button type="button" class="btn" id="motion" aria-pressed="true">움직임 켬</button>
  </div>
</div>

<main class="gutter" id="list"></main>
<footer class="foot gutter">고른 것과 메모는 이 페이지에 저장돼서 다른 기기에서 열어도 그대로 보여요. 같은 버튼을 다시 누르면 풀려요.</footer>

<script>
// ---------------------------------------------------------------- drawing kit (every draft draws in 960 x 540)
const DISPLAY = '"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const BODY = '"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif';
const MONO = '"IBM Plex Mono",ui-monospace,Consolas,monospace';
const P = '#ff4f78', ICE = '#fff5f7', INK = '#0e0e11', GOLD = '#ffd133', CY = '#99edff', PLATE = 'rgba(6,6,8,.86)';
const TAU = Math.PI * 2;
const cl = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lp = (a, b, t) => a + (b - a) * t;
const sg = (t, a, b) => cl((t - a) / (b - a));
const eo = t => 1 - Math.pow(1 - cl(t), 3);
const rnd = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
// 0 → 1 → 0 from time a: in, hold, out
const pulse = (t, a, inn, hold, out) => { const x = t - a; return x < 0 ? 0 : x < inn ? x / inn : x < inn + hold ? 1 : cl(1 - (x - inn - hold) / out); };

function T(c, s, x, y, px, col, al = 'left', f = DISPLAY, w = '') { c.font = w + px + 'px ' + f; c.fillStyle = col; c.textAlign = al; c.textBaseline = 'middle'; c.fillText(s, x, y); }
function R(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(x, y, w, h); }
function PG(c, p, col, st, lw) { c.beginPath(); c.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) c.lineTo(p[i], p[i + 1]); c.closePath(); if (col) { c.fillStyle = col; c.fill(); } if (st) { c.strokeStyle = st; c.lineWidth = lw || 2; c.stroke(); } }
function SK(c, x, y, w, h, s, col, st, lw) { PG(c, [x + s, y, x + w + s, y, x + w, y + h, x, y + h], col, st, lw); }
function LN(c, x1, y1, x2, y2, col, lw) { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.strokeStyle = col; c.lineWidth = lw; c.stroke(); }
function A(c, a, fn) { if (a <= 0) return; c.save(); c.globalAlpha *= cl(a); fn(); c.restore(); }
function negative(c, x = 0, y = 0, w = 960, h = 540) { c.save(); c.globalCompositeOperation = 'difference'; R(c, x, y, w, h, '#fff'); c.restore(); }
function star(c, x, y, R1, r1, n, rot, fill, st, lw) { const p = []; for (let i = 0; i < n * 2; i++) { const a = rot + i * Math.PI / n, r = i % 2 ? r1 : R1; p.push(x + Math.cos(a) * r, y + Math.sin(a) * r); } PG(c, p, fill, st, lw); }

function backdrop(c) {
  const g = c.createLinearGradient(0, 0, 0, 540);
  g.addColorStop(0, '#232b3a'); g.addColorStop(.56, '#39414f'); g.addColorStop(.561, '#22252b'); g.addColorStop(1, '#121418');
  R(c, 0, 0, 960, 540, g);
}
function zombie(c, x, y, s, col) {
  c.fillStyle = col || '#0c0e12';
  c.beginPath(); c.arc(x, y - 80 * s, 11 * s, 0, TAU); c.fill();
  c.fillRect(x - 13 * s, y - 68 * s, 26 * s, 42 * s); c.fillRect(x - 12 * s, y - 28 * s, 10 * s, 30 * s); c.fillRect(x + 2 * s, y - 28 * s, 10 * s, 30 * s);
  c.fillRect(x - 25 * s, y - 64 * s, 10 * s, 30 * s); c.fillRect(x + 15 * s, y - 66 * s, 10 * s, 24 * s);
}
function scene(c, o = {}) {
  backdrop(c);
  c.fillStyle = '#161b24'; [[30, 120, 130], [200, 190, 90], [620, 150, 160], [830, 210, 130]].forEach(b => c.fillRect(b[0], b[1], b[2], 303 - b[1]));
  c.fillStyle = '#1d232e'; [[330, 230, 70], [520, 250, 60]].forEach(b => c.fillRect(b[0], b[1], b[2], 303 - b[1]));
  (o.z || [[300, 330, .9], [610, 322, .75]]).forEach(z => zombie(c, z[0], z[1], z[2]));
}
function cross(c, x = 480, y = 270) { c.fillStyle = 'rgba(255,255,255,.9)'; c.fillRect(x - 1, y - 1, 2, 2); c.fillRect(x - 12, y - 1, 6, 2); c.fillRect(x + 6, y - 1, 6, 2); c.fillRect(x - 1, y - 12, 2, 6); c.fillRect(x - 1, y + 6, 2, 6); }
function gun(c) { PG(c, [640, 540, 720, 452, 905, 372, 960, 384, 960, 540], '#08090b'); PG(c, [720, 452, 905, 372, 912, 384, 740, 462], '#14171c'); }
function hud(c, o = {}) {
  const hp = o.hp === undefined ? 100 : o.hp, res = o.res === undefined ? 90 : o.res;
  SK(c, 60, 474, 220, 16, 6, 'rgba(0,0,0,.55)'); SK(c, 60, 474, 220 * cl(hp / 100), 16, 6, ICE);
  if (o.shield > 0) SK(c, 60, 462, 220 * cl(o.shield / 50), 8, 6, o.shCol || CY);
  T(c, String(Math.round(hp)), 60, 448, 30, ICE);
  T(c, '30', 880, 468, 40, ICE, 'right'); T(c, '/ ' + res, 888, 474, 18, 'rgba(255,255,255,.6)', 'left', MONO, '500 ');
}
function mbar(c, title = '발전기를 켜라', hot) {
  SK(c, 40, 30, 46, 40, 6, hot ? INK : P); T(c, '!', 64, 51, 28, hot ? P : INK, 'center');
  SK(c, 90, 36, 300, 34, 6, hot ? P : PLATE); T(c, title, 108, 54, 19, hot ? INK : ICE);
}
function play(c) { scene(c); cross(c); gun(c); hud(c); }

// ---------------------------------------------------------------- 1. portrait and ultimate gauge
const BUSTS = [null, null];
function bust(i) {
  if (BUSTS[i]) return BUSTS[i];
  const k = document.createElement('canvas'); k.width = k.height = 200; const g = k.getContext('2d'), col = i === 1;
  const bg = g.createLinearGradient(0, 0, 200, 200); bg.addColorStop(0, col ? '#5b3a66' : '#3f3f44'); bg.addColorStop(1, col ? '#f08a7a' : '#8d8d92');
  g.fillStyle = bg; g.fillRect(0, 0, 200, 200);
  g.fillStyle = col ? '#2b1f3a' : '#1f1f22'; g.beginPath(); g.ellipse(100, 200, 78, 66, 0, 0, TAU); g.fill();
  g.fillStyle = col ? '#ffd9cf' : '#bdbdc2'; g.beginPath(); g.arc(100, 92, 30, 0, TAU); g.fill();
  g.fillStyle = col ? '#2b1f3a' : '#1f1f22'; g.beginPath(); g.arc(100, 80, 34, Math.PI, 0); g.fill(); g.fillRect(66, 78, 12, 40); g.fillRect(122, 78, 12, 40);
  return BUSTS[i] = k;
}
const TX = 150, TY = 150, TS = 190;
function cutPath(c, x, y, S, k) { c.beginPath(); c.moveTo(x, y); c.lineTo(x + S - k, y); c.lineTo(x + S, y + k); c.lineTo(x + S, y + S); c.lineTo(x + k, y + S); c.lineTo(x, y + S - k); c.closePath(); }
function slabs(c, rise, blades) {
  c.save(); c.translate(TX + TS / 2, TY + TS / 2); c.rotate(-.1);
  const top = -TS / 2 - 12 - rise; R(c, -TS / 2 - 14, top, TS * .8, TS * .8 + rise, P);
  if (blades) blades(top);
  c.rotate(.2); R(c, -TS / 2 + 18, -TS / 2 + 20, TS, TS, '#000'); c.restore();
}
function tile(c, gray) {
  R(c, TX - 6, TY - 6, TS + 12, TS + 12, '#08080a');
  c.save(); cutPath(c, TX, TY, TS, 18); c.clip(); c.drawImage(bust(gray ? 0 : 1), TX, TY, TS, TS); c.restore();
  R(c, TX - 6, TY + TS + 1, TS + 12, 5, P);
}
// The portrait corner of the HUD, drawn half as large again so the tile reads on a phone.
function pBack(c) { scene(c); R(c, 0, 0, 960, 540, 'rgba(8,8,12,.66)'); c.translate(480, 270); c.scale(1.5, 1.5); c.translate(-380, -205); }
function pSide(c, ch, ready, t) {
  const x = TX + TS + 40;
  T(c, '100', x, TY + TS - 74, 46, ICE); SK(c, x, TY + TS - 44, 250, 14, 5, ICE);
  T(c, '궁극기 ' + Math.round(ch * 100) + '%', x, TY + TS - 8, 18, ready ? P : 'rgba(255,255,255,.6)', 'left', MONO, '500 ');
  if (ready) { const k = eo(sg(t, 3.25, 3.5)); A(c, k, () => { const dx = (1 - k) * 24; SK(c, x + dx, TY + 22, 42, 34, 6, P); T(c, 'X', x + dx + 24, TY + 40, 24, INK, 'center'); T(c, '궁극기 준비', x + dx + 60, TY + 40, 20, ICE); }); }
}
const charge = t => sg(t, .4, 3.2), isReady = t => t > 3.2 && t < 5.8;
function pA(c, t) {
  pBack(c); const ch = charge(t), rd = isReady(t), m = 12; slabs(c, 0); tile(c);
  const x0 = TX - m, y0 = TY - m, x1 = TX + TS + m, y1 = TY + TS + m, L = 4 * (TS + 2 * m);
  c.beginPath(); c.moveTo(x0, y1); c.lineTo(x0, y0); c.lineTo(x1, y0); c.lineTo(x1, y1); c.closePath();
  c.strokeStyle = 'rgba(255,245,247,.16)'; c.lineWidth = 7; c.stroke();
  c.setLineDash([L * ch, L]); c.strokeStyle = rd && t < 3.32 ? '#fff' : P; c.lineWidth = rd ? 7 + 2 * Math.sin(t * 9) : 7; c.stroke(); c.setLineDash([]);
  if (rd) for (let i = 0; i < 8; i++) { const life = ((t - 3.2) * 1.3 + rnd(i)) % 1, px = x1 - rnd(i + 9) * 90, py = y0 - life * 80, s = 12 * (1 - life); A(c, 1 - life, () => PG(c, [px, py, px + s, py - s * 1.6, px + s * 1.5, py + s * .3], i % 3 ? P : ICE)); }
  pSide(c, ch, rd, t);
}
function pB(c, t) {
  pBack(c); const ch = charge(t), rd = isReady(t); slabs(c, 0); tile(c, true);
  const lv = TY + TS + 15 - ch * (TS + 30);
  c.save(); cutPath(c, TX, TY, TS, 18); c.clip();
  c.save(); c.beginPath(); c.moveTo(TX, lv + 15); c.lineTo(TX + TS, lv - 15); c.lineTo(TX + TS, TY + TS); c.lineTo(TX, TY + TS); c.closePath(); c.clip(); c.drawImage(bust(1), TX, TY, TS, TS); c.restore();
  if (ch > 0 && ch < 1) LN(c, TX, lv + 15, TX + TS, lv - 15, P, 4);
  if (rd) { const k = t - 3.2; if (k < .1) negative(c, TX, TY, TS, TS); const sw = (k % 1.3) / 1.3 * (TS + 140); A(c, .24, () => PG(c, [TX - 80 + sw, TY + TS, TX - 40 + sw, TY + TS, TX + 20 + sw, TY, TX - 20 + sw, TY], '#fff')); }
  c.restore();
  pSide(c, ch, rd, t);
}
function pC(c, t) {
  pBack(c); const ch = charge(t), rd = isReady(t), st = Math.floor(t * 12);
  slabs(c, ch * 40, top => {
    for (let i = 0; i < 5; i++) R(c, -TS / 2 - 26, -TS / 2 - 12 - i * 10, i % 4 ? 6 : 11, 2, 'rgba(255,245,247,.7)');
    if (rd) for (let i = 0; i < 4; i++) { const h = 34 + rnd(st + i * 7) * 40, bx = -TS / 2 - 10 + i * 36, tip = bx + 12 + rnd(st + i) * 14; PG(c, [bx, top, bx + 30, top, tip, top - h], i % 2 ? P : '#ff86a3'); PG(c, [bx + 9, top, bx + 21, top, tip - 2, top - h * .45], ICE); }
  });
  tile(c); pSide(c, ch, rd, t);
}

// ---------------------------------------------------------------- 2. counter
const SL = -.28;
function cBase(c) { scene(c, { z: [[250, 330, .8], [700, 326, .75]] }); zombie(c, 480, 400, 1.9); cross(c); gun(c); hud(c); }
function slash(c, ang, th1, th2, grow, col, core) { c.save(); c.translate(480, 270); c.rotate(ang); const L = 760 * grow; PG(c, [-L, -th1 / 2, L, -th2 / 2, L, th2 / 2, -L, th1 / 2], col); if (core) PG(c, [-L, -th1 / 6, L, -th2 / 6, L, th2 / 6, -L, th1 / 6], core); c.restore(); }
function cWord(c, k, out, fill = INK, rim = ICE) {
  const d = (1 - eo(k)) * 90 + out * 46;
  [-1, 1].forEach(s => { c.save(); c.translate(480, 270); c.rotate(SL); c.beginPath(); c.rect(-700, s < 0 ? -220 : 0, 1400, 220); c.clip(); c.translate(s * d, 0);
    c.font = '150px ' + DISPLAY; c.textAlign = 'center'; c.textBaseline = 'middle'; if (rim) { c.lineWidth = 10; c.lineJoin = 'round'; c.strokeStyle = rim; c.strokeText('COUNTER', 0, 0); } c.fillStyle = fill; c.fillText('COUNTER', 0, 0); c.restore(); });
}
function kA(c, t) {
  cBase(c); const e = t - .6; if (e < 0) return; const out = sg(e, 1.1, 1.3);
  if (e < .06) negative(c);
  A(c, (1 - out) * .14, () => R(c, 0, 0, 960, 540, P));
  A(c, 1 - out, () => {
    slash(c, SL, 46, 5, eo(sg(e, 0, .08)), P, ICE); slash(c, .5, 10, 2, eo(sg(e, .05, .13)), ICE);
    for (let i = 0; i < 10; i++) { const k = sg(e, .05, .6), r = (i - 5) * 120 + 60, px = 480 + Math.cos(SL) * r, py = 270 + Math.sin(SL) * r + (rnd(i) - .5) * 2 * k * 90, s = 14 * (1 - k) + 4; PG(c, [px, py, px + s * 1.8, py - s * .5, px + s * .6, py + s], i % 2 ? P : ICE); }
    for (let g = 3; g >= 1; g--) A(c, .3 * (1 - sg(e, .1, .45 + g * .1)), () => { c.save(); c.translate(g * 24 * eo(sg(e, .05, .4)), -g * 7); cWord(c, sg(e, .03, .17), 0, P, null); c.restore(); });
  });
  A(c, 1 - out, () => cWord(c, sg(e, .03, .17), out));

      cards.push({ cv, ctx: cv.getContext('2d'), fn, dur: it.dur, poster: it.poster, seen: false, w: 0 });
    }
    const after = el('div', 'after'), row = el('div', 'after-row');
    const none = el('button', 'none', '셋 다 아니에요'); none.type = 'button'; none.setAttribute('aria-pressed', 'false'); none.addEventListener('click', () => setPick(it.id, 'none'));
    row.append(none); if (it.extra) row.append(el('p', 'extra', it.extra));
    const label = el('label', null, '섞고 싶거나 바꾸고 싶은 점 (안 적어도 돼요)'); label.htmlFor = 'note-' + it.id;
    const ta = el('textarea'); ta.id = 'note-' + it.id; ta.rows = 2; ta.placeholder = '예: A인데 조각은 빼고, C의 작은 글자를 같이';
    ta.addEventListener('input', () => onNote(it.id, ta.value)); ta.addEventListener('blur', () => flushNote(it.id));
    after.append(row, label, ta);
    sec.append(head, grid, after); list.append(sec);
    views[it.id] = { picks, none, ta, picked };
  }
}

function apply(id) {
  const v = views[id], r = results[id], pick = r ? r.pick : '';
  for (const key of Object.keys(v.picks)) { const on = pick === key; v.picks[key].card.dataset.on = String(on); v.picks[key].pick.setAttribute('aria-pressed', String(on)); v.picks[key].pick.disabled = readOnly; }
  v.none.setAttribute('aria-pressed', String(pick === 'none')); v.none.disabled = readOnly; v.ta.readOnly = readOnly;
  if (document.activeElement !== v.ta) v.ta.value = r && r.note ? r.note : '';
  v.picked.textContent = pick === 'none' ? '셋 다 아님' : pick ? pick + ' 고름' : '아직 안 고름';
  v.picked.classList.toggle('on', !!pick);
}
function refresh() { let done = 0; for (const it of ITEMS) { apply(it.id); if (results[it.id] && results[it.id].pick) done++; } $('n-done').textContent = done; }
function setPick(id, key) {
  if (readOnly) return;
  const cur = results[id] || { pick: '', note: '' };
  results[id] = { pick: cur.pick === key ? '' : key, note: cur.note || '' };
  refresh(); save(id);
}
function onNote(id, value) { const cur = results[id] || { pick: '', note: '' }; results[id] = { pick: cur.pick, note: value }; clearTimeout(noteTimers[id]); noteTimers[id] = setTimeout(() => flushNote(id), 900); }
function flushNote(id) { if (noteTimers[id] == null) return; clearTimeout(noteTimers[id]); noteTimers[id] = null; save(id); }

const LOCAL_KEY = 'enfilade-drafts-d';
function status(text, warn) { const s = $('status'); s.textContent = text; s.classList.toggle('warn', !!warn); }
function save(id) {
  if (mode === 'local') { try { localStorage.setItem(LOCAL_KEY, JSON.stringify(results)); } catch (e) {} return; }
  if (!col) return;
  chains[id] = (chains[id] || Promise.resolve()).then(() => {
    const r = results[id], ref = col.doc(id);
    return r && (r.pick || r.note) ? ref.set({ pick: r.pick || '', note: r.note || '', at: new Date().toISOString() }) : ref.delete();
  }).then(() => { if (!readOnly) status('저장됨 · 다른 기기에서도 보여요'); }).catch(e => {
    const code = e && e.code;
    if (code === 'invalid_argument') { readOnly = true; status('보기 전용이에요. 고른 것이 저장되지 않아요.', true); refresh(); }
    else if (code === 'quota_exceeded') status('저장 공간이 꽉 찼어요. Claude에게 알려 주세요.', true);
    else if (code === 'revoked') status('이 페이지의 저장 권한이 바뀌었어요. 새로고침해 주세요.', true);
    else status('방금 고른 것을 저장하지 못했어요. 다시 눌러 주세요.', true);
  });
}
function clean(v) { return v && typeof v === 'object' ? { pick: typeof v.pick === 'string' ? v.pick : '', note: typeof v.note === 'string' ? v.note : '' } : null; }
function useLocal() {
  mode = 'local';
  try { const data = JSON.parse(localStorage.getItem(LOCAL_KEY) || '{}'); for (const it of ITEMS) { const v = clean(data[it.id]); if (v) results[it.id] = v; } } catch (e) {}
  refresh(); status('저장소에 연결할 수 없어서 이 브라우저에만 저장돼요.', true);
}
async function connect() {
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (!db) { useLocal(); return; }
  col = db.collection('picks'); mode = 'db';
  loadTimer = setTimeout(() => status('저장소가 아직 답하지 않아요. 고른 것은 연결되면 저장돼요.', true), 10000);
  const pending = Object.keys(results); let first = true;
  col.onSnapshot(snap => {
    const next = {};
    for (const d of snap.docs) { const v = clean(d.data()); if (v && views[d.id]) next[d.id] = v; }
    // A note being typed right now is not overwritten by what the store last held.
    for (const id of Object.keys(noteTimers)) if (noteTimers[id] != null && results[id]) next[id] = { pick: next[id] ? next[id].pick : results[id].pick, note: results[id].note };
    if (first) { first = false; for (const id of pending) if (results[id]) next[id] = results[id]; }
    for (const k of Object.keys(results)) delete results[k];
    Object.assign(results, next); refresh();
    if (!snap.metadata.fromCache) { clearTimeout(loadTimer); if (!readOnly) status('저장됨 · 다른 기기에서도 보여요'); }
    if (pending.length) for (const id of pending.splice(0)) save(id);
  }, err => {
    clearTimeout(loadTimer);
    status(err && err.code === 'revoked' ? '이 페이지의 저장 권한이 바뀌었어요. 새로고침해 주세요.' : '저장소 연결이 끊겼어요. 새로고침하면 다시 연결돼요.', true);
  });
}

// ---------------------------------------------------------------- one clock for every draft on screen
function size(card) {
  const w = card.cv.clientWidth; if (!w || w === card.w) return false;
  const dpr = Math.min(2, window.devicePixelRatio || 1); card.w = w; card.cv.width = Math.round(w * dpr); card.cv.height = Math.round(w * dpr * 9 / 16); return true;
}
function paint(card, time) {
  const c = card.ctx, cv = card.cv; if (!cv.width) return;
  c.setTransform(cv.width / 960, 0, 0, cv.height / 540, 0, 0); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over'; c.shadowBlur = 0; c.setLineDash([]);
  c.save(); try { card.fn(c, time); } catch (e) { if (!card.failed) { card.failed = true; console.error(e); } } c.restore();
}
function frame(now) {
  const t = now / 1000;
  for (const card of cards) { const resized = size(card); if (!card.seen && !resized) continue; if (moving) paint(card, t % card.dur); else if (resized || card.still !== true) { paint(card, card.poster); card.still = true; } }
  requestAnimationFrame(frame);
}
function setMoving(on) { moving = on; for (const card of cards) card.still = false; const b = $('motion'); b.setAttribute('aria-pressed', String(on)); b.textContent = on ? '움직임 켬' : '움직임 끔'; }

build();
setMoving(moving);
$('motion').addEventListener('click', () => setMoving(!moving));
if ('IntersectionObserver' in window) { const io = new IntersectionObserver(es => { for (const e of es) { const card = cards.find(k => k.cv === e.target); if (card) { card.seen = e.isIntersecting; if (card.seen) card.still = false; } } }, { rootMargin: '120px' }); cards.forEach(card => io.observe(card.cv)); }
else cards.forEach(card => { card.seen = true; });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { for (const card of cards) card.still = false; });
refresh();
requestAnimationFrame(frame);
connect();
</script>
